<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="icon" href="../images/logo.png" type="image/png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 互动填词游戏 - 华小老师专区</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/cyberpunk.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <style>
        :root {
            --primary-color: #27ae60;
            --primary-hover: #219653;
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-main: #333;
            --text-sub: #666;
            --border-radius: 12px;
            --shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding-top: 50px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .back-link-wrapper {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
        }

        .back-link {
            text-decoration: none;
            color: var(--primary-color);
            font-weight: bold;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .main-wrapper {
            width: 100%;
            max-width: 900px;
            padding: 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .tool-header h1 {
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 2.2rem;
            text-align: center;
        }

        /* 出题面板 */
        .creator-panel {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            padding: 25px;
            width: 100%;
            margin-bottom: 20px;
            border-top: 4px solid #f39c12;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .input-group {
            display: flex;
            gap: 10px;
        }

        .input-group input {
            flex: 1;
            padding: 12px 15px;
            font-size: 1.1rem;
            border: 2px solid #ddd;
            border-radius: 8px;
            outline: none;
        }

        .input-group input:focus {
            border-color: #f39c12;
        }

        button {
            padding: 12px 25px;
            font-size: 1.1rem;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-generate {
            background-color: #f39c12;
        }

        .btn-random {
            background-color: #9b59b6;
        }

        .btn-check {
            background-color: var(--primary-color);
            margin-top: 20px;
        }

        .loading-overlay {
            display: none;
            text-align: center;
            padding: 20px;
            color: #f39c12;
            font-weight: bold;
        }

        /* 游戏面板 */
        .game-panel {
            display: none;
            background: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            padding: 30px;
            width: 100%;
            text-align: center;
            border-top: 4px solid var(--primary-color);
        }

        .game-image {
            width: 100%;
            max-width: 500px;
            height: auto;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
            background-color: #eee;
            min-height: 200px;
            object-fit: cover;
        }

        .sentence-area {
            font-size: 2rem;
            line-height: 1.8;
            margin-bottom: 40px;
            color: #2c3e50;
            font-weight: 500;
        }

        .drop-zone {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 120px;
            min-height: 60px;
            padding: 2px;
            border: 3px dashed #ccc;
            border-radius: 8px;
            vertical-align: middle;
            margin: 0 10px;
            background: #fafafa;
            transition: all 0.3s;
        }

        .drop-zone .word-tile {
            margin: 0;
            box-shadow: none;
            cursor: pointer;
        }

        .drop-zone.hover {
            background: #e8f8f5;
            border-color: var(--primary-color);
            transform: scale(1.05);
        }

        .drop-zone.correct {
            border-color: var(--primary-color);
            background: #d4efdf;
        }

        .drop-zone.incorrect {
            border-color: #e74c3c;
            background: #fadedc;
            animation: shake 0.5s;
        }

        .word-bank {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            min-height: 80px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 12px;
            border: 2px dashed #ddd;
        }

        .word-tile {
            background: #3498db;
            color: white;
            padding: 12px 25px;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: grab;
            box-shadow: 0 4px 6px rgba(52, 152, 219, 0.3);
            user-select: none;
            transition: transform 0.1s;
        }

        .word-tile:active {
            cursor: grabbing;
            transform: scale(0.95);
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-5px);
            }

            75% {
                transform: translateX(5px);
            }
        }

        .confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
        }
    </style>
</head>

<body>
    <div class="back-link-wrapper">
        <a href="../index.html" class="back-link">← 返回工具箱主页</a>
    </div>

    <canvas id="confetti" class="confetti-canvas"></canvas>

    <div class="main-wrapper">
        <div class="tool-header">
            <h1>AI 互动填词游戏</h1>
        </div>

        <div class="creator-panel">
            <h3>👨‍🏫 老师出题区</h3>
            <p style="color:#666; margin-top:0;">输入一个简单的主题，AI 将自动为你生成插图和填空题，并永久保存到题库中！</p>
            <div class="input-group">
                <input type="text" id="topicInput" placeholder="例如：The boy is playing soccer...">
                <button class="btn-generate" id="generateBtn" onclick="generateNewGame()">✨ 自动生成新题</button>
            </div>
            <div style="text-align: center; margin-top: 10px;">
                <span style="color:#888;">或者</span>
            </div>
            <button class="btn-random" id="randomBtn" onclick="fetchRandomGame()">🎲 从题库随机抽取一题</button>

            <div class="loading-overlay" id="loadingArea">
                <p>正在呼叫 AI 大脑... 🧠 (可能需要10-20秒生成文字和图片)</p>
            </div>
        </div>

        <div class="game-panel" id="gamePanel">
            <img id="gameImage" class="game-image" src="" alt="AI Generated Illustration">

            <div id="sentenceArea" class="sentence-area">
                <!-- Sentence will be injected here -->
            </div>

            <div id="wordBank" class="word-bank">
                <!-- Word tiles will be injected here -->
            </div>

            <button class="btn-check" id="checkBtn" onclick="checkAnswers()" style="display: none;">检查答案</button>
        </div>
    </div>

    <!-- Audio Effects -->
    <audio id="snapSound" src="data:audio/wav;base64,UklGRl9vT19XQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YU..."
        preload="auto"></audio>
    <audio id="successSound" src="data:audio/wav;base64,UklGRl9vT19XQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YU..."
        preload="auto"></audio>

    <!-- Simple Confetti Script -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script>
        const API_URL = "/api/gateway";
        const DB_URL = "/api/cloze-db";
        const LLM_MODEL = "gemini-3.5-flash"; // 改回使用 Google Gemini API，彻底告别 524 拥堵报错
        // 我们不再依赖 NVIDIA NIM 生成图片，改为使用免费无限制的 Pollinations AI 节点
        let currentGameData = null;

        // --- 1. 生成新游戏 (AI Pipeline) ---
        async function generateNewGame() {
            const topic = document.getElementById('topicInput').value.trim();
            if (!topic) return alert("请输入主题词！");

            const genBtn = document.getElementById('generateBtn');
            const randBtn = document.getElementById('randomBtn');
            const loading = document.getElementById('loadingArea');
            const gamePanel = document.getElementById('gamePanel');

            genBtn.disabled = true;
            randBtn.disabled = true;
            loading.style.display = 'block';
            gamePanel.style.display = 'none';

            try {
                // Step 1: Generate Text & Blanks
                const prompt = `Create a very simple English sentence for a 7-year-old child about "${topic}". 
                Pick 1 or 2 nouns or simple verbs to be blanks. 
                Return ONLY a JSON object exactly like this: {"sentence": "the complete sentence", "blanks": ["word1"]}. 
                Do not include markdown or codeblocks.`;

                const textRes = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ model: LLM_MODEL, messages: [{ role: "user", content: prompt }] })
                });

                if (!textRes.ok) {
                    let errMsg = "文本生成失败";
                    try {
                        const errData = await textRes.json();
                        errMsg += ": " + (errData.error || errData.message || JSON.stringify(errData));
                    } catch (e) {
                        errMsg += " (Status: " + textRes.status + ")";
                    }
                    throw new Error(errMsg);
                }
                const textData = await textRes.json();

                let content = textData.choices[0].message.content;
                content = content.replace(/^```json\n?/g, '').replace(/```$/g, '').trim();
                const parsedText = JSON.parse(content);

                // Step 2: Generate Image using Pollinations AI (100% Free)
                // 优化了 Prompt，专门用于减少 AI 产生文字和幻觉的几率
                const imagePrompt = `A very simple cute flat vector illustration for preschool kids, white background, single subject, absolutely NO text, NO letters, NO words, depicting: ${parsedText.sentence}`;
                const pollUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(imagePrompt)}?width=512&height=512&nologo=true`;

                const imgRes = await fetch(pollUrl);
                if (!imgRes.ok) {
                    throw new Error("免费画图接口超时或无响应，请重试");
                }

                // Convert the received image blob to Base64 for storing in D1 Database
                const imageBlob = await imgRes.blob();
                const base64Image = await new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onloadend = () => resolve(reader.result);
                    reader.readAsDataURL(imageBlob);
                });

                // Step 3: Save to D1 Database
                const dbPayload = {
                    topic: topic,
                    sentence: parsedText.sentence,
                    blanks: parsedText.blanks,
                    image_b64: base64Image
                };

                const saveRes = await fetch(DB_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dbPayload)
                });

                // Start Game
                startGame(dbPayload);

            } catch (err) {
                console.error(err);
                alert("生成出错: " + err.message);
            } finally {
                genBtn.disabled = false;
                randBtn.disabled = false;
                loading.style.display = 'none';
            }
        }

        // --- 2. 从题库获取随机游戏 ---
        async function fetchRandomGame() {
            const randBtn = document.getElementById('randomBtn');
            randBtn.disabled = true;
            randBtn.innerText = "🎲 抽取中...";

            try {
                const res = await fetch(DB_URL);
                if (!res.ok) throw new Error("无法获取题库，可能是题库为空");

                const data = await res.json();
                if (data.error) throw new Error(data.error);

                // Parse blanks if it's stored as JSON string
                if (typeof data.blanks === 'string') {
                    data.blanks = JSON.parse(data.blanks);
                }

                startGame(data);
            } catch (err) {
                alert(err.message);
            } finally {
                randBtn.disabled = false;
                randBtn.innerText = "🎲 从题库随机抽取一题";
            }
        }

        // --- 3. 游戏逻辑与拖拽 ---
        function startGame(data) {
            currentGameData = data;
            document.getElementById('gamePanel').style.display = 'block';
            document.getElementById('checkBtn').style.display = 'inline-block';
            document.getElementById('gameImage').src = data.image_b64 || '../images/placeholder.png';

            const sentenceArea = document.getElementById('sentenceArea');
            const wordBank = document.getElementById('wordBank');
            sentenceArea.innerHTML = '';
            wordBank.innerHTML = '';

            let displaySentence = data.sentence;

            // Create blanks in sentence
            data.blanks.forEach((word, index) => {
                // Use regex to replace the exact word (case-insensitive, whole word)
                const regex = new RegExp(`\\b${word}\\b`, 'gi');
                displaySentence = displaySentence.replace(regex, `<div class="drop-zone" data-target="${word.toLowerCase()}" ondragover="allowDrop(event)" ondrop="drop(event)" ondragenter="dragEnter(event)" ondragleave="dragLeave(event)"></div>`);
            });

            sentenceArea.innerHTML = displaySentence;

            // Create draggable tiles (shuffled)
            const shuffledBlanks = [...data.blanks].sort(() => Math.random() - 0.5);
            shuffledBlanks.forEach((word, index) => {
                const tile = document.createElement('div');
                tile.className = 'word-tile';
                tile.draggable = true;
                tile.id = 'word-' + index;
                tile.innerText = word;
                tile.dataset.word = word.toLowerCase();

                tile.ondragstart = drag;
                wordBank.appendChild(tile);
            });

            // Allow word bank to receive words back
            wordBank.ondragover = allowDrop;
            wordBank.ondrop = dropToBank;
        }

        // --- 拖拽事件 ---
        function allowDrop(ev) {
            ev.preventDefault();
        }

        function dragEnter(ev) {
            if (ev.target.classList.contains('drop-zone')) {
                ev.target.classList.add('hover');
            }
        }

        function dragLeave(ev) {
            if (ev.target.classList.contains('drop-zone')) {
                ev.target.classList.remove('hover');
            }
        }

        function drag(ev) {
            ev.dataTransfer.setData("text", ev.target.id);
        }

        function drop(ev) {
            ev.preventDefault();
            ev.target.classList.remove('hover');

            if (!ev.target.classList.contains('drop-zone')) return;

            // If dropzone already has a word, return it to bank
            if (ev.target.hasChildNodes()) {
                const existingWord = ev.target.firstChild;
                document.getElementById('wordBank').appendChild(existingWord);
            }

            var data = ev.dataTransfer.getData("text");
            ev.target.appendChild(document.getElementById(data));

            // Play snap sound (if we had a real one, skipping for now to avoid errors)
            // document.getElementById('snapSound').play().catch(e => {});
        }

        function dropToBank(ev) {
            ev.preventDefault();
            var data = ev.dataTransfer.getData("text");
            if (ev.target.id === 'wordBank' || ev.target.classList.contains('word-tile')) {
                document.getElementById('wordBank').appendChild(document.getElementById(data));
            }
        }

        // --- 检查答案 ---
        function checkAnswers() {
            const dropZones = document.querySelectorAll('.drop-zone');
            let allCorrect = true;

            dropZones.forEach(zone => {
                zone.classList.remove('correct', 'incorrect');

                if (!zone.hasChildNodes()) {
                    zone.classList.add('incorrect');
                    allCorrect = false;
                    return;
                }

                const tile = zone.firstChild;
                if (tile.dataset.word === zone.dataset.target) {
                    zone.classList.add('correct');
                } else {
                    zone.classList.add('incorrect');
                    allCorrect = false;
                    // Return incorrect tile to bank after delay
                    setTimeout(() => {
                        document.getElementById('wordBank').appendChild(tile);
                        zone.classList.remove('incorrect');
                    }, 800);
                }
            });

            if (allCorrect) {
                confetti({
                    particleCount: 150,
                    spread: 70,
                    origin: { y: 0.6 }
                });
            }
        }
    </script>
</body>

</html>
