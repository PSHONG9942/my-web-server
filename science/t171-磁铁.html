<!DOCTYPE html>

<html lang="zh-MY">



<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>单元七：神奇的磁铁</title>

    <link rel="icon" href="../images/logo.png" type="image/png">

    <style>
        /* ================= 第一关：磁性分类 ================= */

        .sorting-area {

            display: flex;

            justify-content: space-around;

            margin-bottom: 40px;

        }



        .magnet-zone {

            width: 350px;

            height: 350px;

            border-radius: 20px;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: flex-start;

            padding-top: 20px;

            transition: all 0.3s;

            position: relative;

        }



        /* U型磁铁造型 (吸铁区) */

        #zone-magnetic {

            border: 5px dashed #F44336;

            background: #FFEBEE;

        }



        /* 普通篮子造型 (不吸铁区) */

        #zone-non-magnetic {

            border: 5px dashed #9E9E9E;

            background: #F5F5F5;

        }



        .zone-title {

            font-size: 1.8rem;

            font-weight: bold;

            margin-bottom: 20px;

        }



        /* 物品库 */

        .items-pool {

            display: flex;

            justify-content: center;

            gap: 15px;

            flex-wrap: wrap;

            padding: 20px;

            background: #E3F2FD;

            border-radius: 20px;

            max-height: 500px;

            /* 增加高度限制，防止太长 */

            overflow-y: auto;

        }



        .item {

            width: 70px;

            height: 70px;

            /* 稍微缩小一点，容纳更多物品 */

            background: white;

            border-radius: 15px;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            font-size: 2.5rem;

            cursor: grab;

            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.1);

            transition: transform 0.2s;

            border: 3px solid #fff;

        }



        .item span {

            font-size: 0.9rem;

            margin-top: 2px;

            font-weight: bold;

            color: #555;

        }



        .item:active {

            cursor: grabbing;

            transform: scale(1.1);

        }



        /* 物品被吸住的效果 */

        .item.stuck {

            position: absolute;

            transform: scale(0.7);

            /* 吸入后变小一点 */

            box-shadow: none;

            border: none;

            background: transparent;

            pointer-events: none;

        }



        /* ================= 第二关：相吸相斥 ================= */

        .magnets-container {

            display: flex;

            justify-content: center;

            align-items: center;

            gap: 50px;

            height: 300px;

            position: relative;

        }



        /* 磁铁样式 */

        /* 磁铁样式 */
        .bar-magnet {
            width: 300px;
            height: 100px;
            position: relative;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        .magnet-svg {
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .text-n, .text-s {
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* 翻转动画核心：旋转SVG本身，并反向旋转文字使其保持正立 */
        .bar-magnet.flipped .magnet-svg {
            transform: rotate(180deg);
        }

        .bar-magnet.flipped .text-n {
            transform-origin: 75px 50px;
            transform: rotate(180deg);
        }

        .bar-magnet.flipped .text-s {
            transform-origin: 225px 50px;
            transform: rotate(180deg);
        }



        /* 控制按钮 */

        .control-panel {

            margin-top: 50px;

            display: flex;

            justify-content: center;

            gap: 30px;

        }



        .action-btn {

            padding: 15px 30px;

            font-size: 1.5rem;

            border-radius: 50px;

            border: none;

            cursor: pointer;

            color: white;

            font-weight: bold;

            box-shadow: 0 5px 0 rgba(0, 0, 0, 0.2);

            transition: transform 0.1s;

        }



        .btn-flip {

            background: #FF9800;

        }



        .btn-test {

            background: #4CAF50;

        }



        .action-btn:active {

            transform: translateY(4px);

            box-shadow: none;

        }



        /* 结果文字 */

        #experiment-result {

            font-size: 2rem;

            font-weight: bold;

            margin-top: 30px;

            height: 50px;

            color: #333;

        }



        /* 动画类 */

        .attract-left {

            transform: translateX(75px);

        }



        .attract-right {

            transform: translateX(-75px);

        }



        .repel-left {

            transform: translateX(-100px) rotate(-10deg);

        }



        .repel-right {

            transform: translateX(100px) rotate(10deg);

        }



        @keyframes popIn {

            from {

                opacity: 0;

                transform: scale(0.9);

            }



            to {

                opacity: 1;

                transform: scale(1);

            }

        }

    </style>



    <!-- Global Light Cyberpunk Theme -->

<body>



    <a href="index.html" class="back-btn-corner">⬅ 返回菜单</a>

    <p class="intro">选择一个实验室，开始探索磁铁的奥秘吧！</p>

    <div id="level-1" class="game-stage active">

        <div class="sorting-area">

    <defs>

    </g>
</svg>

            </div>



            <div class="magnet-zone" id="zone-non-magnetic" data-type="non-magnetic">

                <div class="zone-title" style="color: #616161;">🚫 不能被吸引 (Tidak)</div>

                <svg width="200" height="200" viewBox="0 0 200 200" style="opacity: 0.2; position: absolute; top: 80px; left: 50%; transform: translateX(-50%); pointer-events: none;">
    <g transform="translate(10, 20) rotate(-15)">
        <rect x="20" y="80" width="120" height="60" rx="10" fill="#8D6E63" stroke="#5D4037" stroke-width="4"/>
        <ellipse cx="20" cy="110" rx="15" ry="30" fill="#D7CCC8" stroke="#5D4037" stroke-width="4"/>
        <path d="M 40,95 Q 80,85 120,100 M 50,125 Q 90,135 130,115" stroke="#5D4037" stroke-width="3" fill="none" stroke-linecap="round"/>
    </g>
    <g transform="translate(80, 10) rotate(15)">
        <rect x="30" y="40" width="40" height="100" rx="10" fill="#B3E5FC" stroke="#0288D1" stroke-width="4" opacity="0.8"/>
        <rect x="40" y="20" width="20" height="20" fill="#B3E5FC" stroke="#0288D1" stroke-width="4"/>
        <rect x="35" y="10" width="30" height="10" rx="3" fill="#0288D1"/>
        <path d="M 32,90 Q 50,100 68,90 L 68,130 A 8,8 0 0,1 32,130 Z" fill="#29B6F6" opacity="0.6"/>
    </g>
</svg>

            </div>

        </div>



        <div class="items-pool" id="items-container"></div>

        <div id="feedback-l1" style="font-size: 1.5rem; margin-top: 20px; font-weight: bold; color: #4CAF50;"></div>

    </div>



    <div id="level-2" class="game-stage">

        <div style="margin-bottom: 40px; font-size: 1.5rem; color: #555;">

            观察两个磁铁的磁极，点击“开始靠近”看看会发生什么？

        </div>



        <div class="magnets-container">

            <div class="bar-magnet" id="magnet-left">
            <svg class="magnet-svg" viewBox="0 0 300 100" width="100%" height="100%">
                <defs>
                    <linearGradient id="redMag" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#FF5252"/>
                        <stop offset="50%" stop-color="#E53935"/>
                        <stop offset="100%" stop-color="#B71C1C"/>
                    </linearGradient>
                    <linearGradient id="blueMag" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#448AFF"/>
                        <stop offset="50%" stop-color="#1E88E5"/>
                        <stop offset="100%" stop-color="#0D47A1"/>
                    </linearGradient>
                    <linearGradient id="glass" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="rgba(255,255,255,0.6)"/>
                        <stop offset="30%" stop-color="rgba(255,255,255,0.1)"/>
                        <stop offset="100%" stop-color="rgba(255,255,255,0)"/>

                    <text class="text-s" x="225" y="65" font-family="Arial, sans-serif" font-size="45" font-weight="bold" fill="white" text-anchor="middle" style="text-shadow: 2px 2px 4px rgba(0,0,0,0.4);">S</text>

            <div class="bar-magnet flipped" id="magnet-right">

                <defs>
                    <linearGradient id="redMag" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#FF5252"/>
                        <stop offset="50%" stop-color="#E53935"/>
                        <stop offset="100%" stop-color="#B71C1C"/>
                    </linearGradient>
                    <linearGradient id="blueMag" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#448AFF"/>
                        <stop offset="50%" stop-color="#1E88E5"/>
                        <stop offset="100%" stop-color="#0D47A1"/>
                    </linearGradient>
                    <linearGradient id="glass" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="rgba(255,255,255,0.6)"/>
                        <stop offset="30%" stop-color="rgba(255,255,255,0.1)"/>
                        <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
                    </linearGradient>
                    <filter id="shadowBar">
                        <feDropShadow dx="2" dy="5" stdDeviation="3" flood-color="#000" flood-opacity="0.4"/>
                    </filter>
                </defs>
                <g filter="url(#shadowBar)">
                    <path d="M 10,10 L 150,10 L 150,90 L 10,90 A 10,10 0 0,1 0,80 L 0,20 A 10,10 0 0,1 10,10 Z" fill="url(#redMag)" />
                    <path d="M 150,10 L 290,10 A 10,10 0 0,1 300,20 L 300,80 A 10,10 0 0,1 290,90 L 150,90 Z" fill="url(#blueMag)" />
                    <path d="M 10,10 L 290,10 A 10,10 0 0,1 300,20 L 300,40 L 0,40 L 0,20 A 10,10 0 0,1 10,10 Z" fill="url(#glass)" />
                    <text class="text-n" x="75" y="65" font-family="Arial, sans-serif" font-size="45" font-weight="bold" fill="white" text-anchor="middle" style="text-shadow: 2px 2px 4px rgba(0,0,0,0.4);">N</text>
                    <text class="text-s" x="225" y="65" font-family="Arial, sans-serif" font-size="45" font-weight="bold" fill="white" text-anchor="middle" style="text-shadow: 2px 2px 4px rgba(0,0,0,0.4);">S</text>
                </g>
            </svg>
            </div>

        </div>



        <div id="experiment-result">准备实验...</div>



        <div class="control-panel">

            <button class="action-btn btn-flip" onclick="flipRightMagnet()">🔄 翻转右边磁铁</button>

            <button class="action-btn btn-test" onclick="runExperiment()">🚀 开始靠近</button>

        </div>

    </div>



    <script>

        // ================= 通用逻辑 =================

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {

            if (audioCtx.state === 'suspended') audioCtx.resume();

            const osc = audioCtx.createOscillator();

            const gain = audioCtx.createGain();

            osc.connect(gain); gain.connect(audioCtx.destination);



            if (type === 'correct') {

                osc.frequency.setValueAtTime(600, audioCtx.currentTime);

                osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);

                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);

                gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.3);

                osc.start(); osc.stop(audioCtx.currentTime + 0.3);

            } else if (type === 'wrong') {

                osc.type = 'sawtooth';

                osc.frequency.setValueAtTime(150, audioCtx.currentTime);

                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);

                gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.3);

                osc.start(); osc.stop(audioCtx.currentTime + 0.3);

            } else if (type === 'snap') {

                osc.frequency.setValueAtTime(200, audioCtx.currentTime);

                osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.1);

                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);

                gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.1);

                osc.start(); osc.stop(audioCtx.currentTime + 0.1);

            }

        }



        function switchLevel(level) {

            document.querySelectorAll('.game-stage').forEach(el => el.classList.remove('active'));

            document.querySelectorAll('.level-btn').forEach(el => el.classList.remove('active'));



            document.getElementById(`level-${level}`).classList.add('active');

            document.querySelectorAll('.level-btn')[level - 1].classList.add('active');



            if (level === 1) initLevel1();

            if (level === 2) resetLevel2();

        }



        // ================= 第一关逻辑：物品数据升级 =================

        // 20个物品数据，来源自 Lab Simulator

        const itemsData = [

            { name: '铁钉', icon: '🔩', type: 'magnetic' },

            { name: '橡皮', icon: '🧼', type: 'non-magnetic' },

            { name: '钥匙', icon: '🔑', type: 'magnetic' },

            { name: '铅笔', icon: '✏️', type: 'non-magnetic' },

            { name: '回形针', icon: '📎', type: 'magnetic' },

            { name: '塑料瓶', icon: '🥤', type: 'non-magnetic' },

            { name: '螺丝', icon: '🔩', type: 'magnetic' },

            { name: '木积木', icon: '🪵', type: 'non-magnetic' },

            { name: '铁尺', icon: '📏', type: 'magnetic' },

            { name: '弹珠', icon: '🔮', type: 'non-magnetic' },

            { name: '别针', icon: '🧷', type: 'magnetic' },

            { name: '纸张', icon: '📄', type: 'non-magnetic' },

            { name: '剪刀', icon: '✂️', type: 'magnetic' },

            { name: '铝罐', icon: '🥫', type: 'non-magnetic' }, // 铝不吸磁

            { name: '铁勺', icon: '🥄', type: 'magnetic' },

            { name: '金戒指', icon: '💍', type: 'non-magnetic' }, // 金不吸磁

            { name: '螺母', icon: '⚙️', type: 'magnetic' },

            { name: '羽毛', icon: '🪶', type: 'non-magnetic' },

            { name: '订书钉', icon: '🖇️', type: 'magnetic' },

            { name: '棉花', icon: '☁️', type: 'non-magnetic' }

        ];



        function initLevel1() {

            const container = document.getElementById('items-container');

            container.innerHTML = '';

            document.getElementById('feedback-l1').innerText = '';



            // 打乱顺序

            const shuffled = [...itemsData].sort(() => 0.5 - Math.random());



            shuffled.forEach(item => {

                const el = document.createElement('div');

                el.className = 'item';

                el.draggable = true;

                el.dataset.type = item.type;

                el.innerHTML = `${item.icon}<span>${item.name}</span>`;



                el.ondragstart = (e) => {

                    e.dataTransfer.setData('type', item.type);

                    window.currentDragItem = el;

                };



                // 手机点击支持

                el.onclick = () => {

                    simulateDrop(el, item.type);

                };



                container.appendChild(el);

            });

        }



        const dropZones = document.querySelectorAll('.magnet-zone');

        dropZones.forEach(zone => {

            zone.ondragover = (e) => e.preventDefault();

            zone.ondrop = (e) => {

                e.preventDefault();

                const type = e.dataTransfer.getData('type');

                checkDrop(zone, type, window.currentDragItem);

            };

        });



        function checkDrop(zone, type, element) {

            if (zone.dataset.type === type) {

                // 答对了

                playSound('correct');

                element.classList.add('stuck');

                // 随机放置在篮子里

                const x = Math.random() * 200 + 50;

                const y = Math.random() * 200 + 80;

                element.style.left = x + 'px';

                element.style.top = y + 'px';

                zone.appendChild(element);



                checkWinL1();

            } else {

                // 答错了

                playSound('wrong');

                document.getElementById('feedback-l1').innerText = "哎呀，放错啦！再试试？";

                setTimeout(() => document.getElementById('feedback-l1').innerText = "", 1000);

            }

        }



        function simulateDrop(element, type) {

            const targetZone = document.getElementById(type === 'magnetic' ? 'zone-magnetic' : 'zone-non-magnetic');

            checkDrop(targetZone, type, element);

        }



        function checkWinL1() {

            const remaining = document.getElementById('items-container').children.length;

            if (remaining === 0) {

                document.getElementById('feedback-l1').innerText = "🎉 太棒了！你已经学会分辨磁性物体了！";

                playSound('correct');

            }

        }



        // ================= 第二关逻辑 (保持不变) =================

        let isFlipped = false; // false = N在左, S在右



        function flipRightMagnet() {

            const mag = document.getElementById('magnet-right');

            resetLevel2();

            isFlipped = !isFlipped;

            if (isFlipped) {

                mag.classList.remove('flipped'); // 正常顺序 N-S

            } else {

                mag.classList.add('flipped'); // 翻转 S-N

            }

        }



        function resetLevel2() {

            const left = document.getElementById('magnet-left');

            const right = document.getElementById('magnet-right');

            const resultText = document.getElementById('experiment-result');



            left.className = "bar-magnet";

            right.className = "bar-magnet" + (isFlipped ? "" : " flipped");

            resultText.innerText = "准备实验...";

            resultText.style.color = "#333";

        }



        function runExperiment() {

            const left = document.getElementById('magnet-left');

            const right = document.getElementById('magnet-right');

            const resultText = document.getElementById('experiment-result');



            if (isFlipped) {

                // S (Left) vs N (Right) -> 异极相吸

                left.classList.add('attract-left');

                right.classList.add('attract-right');

                playSound('snap');

                resultText.innerText = "🤝 异极相吸 (Menarik)";

                resultText.style.color = "#2E7D32";

            } else {

                // S (Left) vs S (Right) -> 同极相斥

                left.classList.add('repel-left');

                right.classList.add('repel-right');

                playSound('wrong');

                resultText.innerText = "💨 同极相斥 (Menolak)";

                resultText.style.color = "#D32F2F";

            }

        }



        // 初始化

        initLevel1();

    </script>

</body>
