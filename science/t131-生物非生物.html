<!DOCTYPE html>

<html lang="zh-MY">

<head>

    <meta charset="UTF-8">

    <link rel="icon" href="../images/logo.png" type="image/png">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>一年级科学：生物与非生物</title>

    <style>
        .game-board {

            display: flex;

            justify-content: center;

            gap: 30px;

            margin-bottom: 40px;

            flex-wrap: wrap;

        }

        .drop-zone {

            width: 100%;

            max-width: 100%;

            max-width: 100%;

            width: 45%;

            min-height: 350px;

            border: 4px dashed #bdc3c7;

            border-radius: 20px;

            background-color: white;

            display: flex;

            flex-direction: column;

            transition: all 0.3s;

            overflow: hidden;

            position: relative;

        }

        .drop-zone.hover {

            border-color: #3498db;

            background-color: #eaf2f8;

            transform: scale(1.02);

            box-shadow: 0 0 15px rgba(52, 152, 219, 0.3);

        }

        .zone-header {

            padding: 15px;

            border-bottom: 2px solid #ecf0f1;

            background-color: #f9f9f9;

        }

        .zone-header h2 {

            margin: 0;

            font-size: 24px;

        }

        .zone-header small {

            font-size: 14px;

            opacity: 0.7;

            display: block;

            margin-top: 5px;

        }

        .zone-content {

            flex: 1;

            padding: 15px;

            display: flex;

            flex-wrap: wrap;

            align-content: flex-start;

            justify-content: center;

            gap: 10px;

        }

        #zone-living {

            border-color: #2ecc71;

        }

        #zone-living .zone-header {

            color: #27ae60;

            background-color: #eafaf1;

        }

        #zone-non-living {

            border-color: #95a5a6;

        }

        #zone-non-living .zone-header {

            color: #7f8c8d;

            background-color: #f4f6f6;

        }

        .items-pool {

            min-height: 120px;

            display: flex;

            justify-content: center;

            gap: 15px;

            flex-wrap: wrap;

            padding: 20px;

            border-top: 2px solid #eee;

        }

        .draggable-item {

            width: 100%;

            max-width: 80px;

            height: 90px;

            background-color: white;

            border: 2px solid #34495e;

            border-radius: 12px;

            cursor: grab;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);

            transition: transform 0.2s, box-shadow 0.2s;

            z-index: 10;

        }

        .draggable-item .icon {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 40px;
            margin-bottom: 5px;
            transition: transform 0.2s;
        }
        .draggable-item .icon svg {
            width: 45px;
            height: 45px;
            filter: drop-shadow(2px 2px 3px rgba(0,0,0,0.1));
        }

        .draggable-item span {

            font-size: 14px;

            font-weight: bold;

        }

        .draggable-item:active {

            cursor: grabbing;

            transform: scale(1.1) rotate(3deg);

        }

        .draggable-item.dropped {

            cursor: default;

            border-color: transparent;

            background-color: rgba(255, 255, 255, 0.8);

            box-shadow: none;

            width: 70px;

            height: 80px;

            transform: scale(1);

            animation: landIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);

        }

        .draggable-item.dropped .icon::after {

            content: '✔️';

            font-size: 12px;

            position: absolute;

            top: 0;

            right: 0;

            background: #2ecc71;

            color: white;

            border-radius: 50%;

            width: 16px;

            height: 16px;

            display: flex;

            align-items: center;

            justify-content: center;

        }

        @keyframes landIn {

            0% {

                transform: scale(0.1);

                opacity: 0;

            }

            70% {

                transform: scale(1.1);

            }

            100% {

                transform: scale(1);

                opacity: 1;

            }

        }

        .modal-overlay {

            display: none;

            position: fixed;

            top: 0;

            left: 0;

            width: 100%;

            height: 100%;

            background: rgba(0, 0, 0, 0.85);

            justify-content: center;

            align-items: center;

            z-index: 999;

        }

        .modal-content {

            background: white;

            padding: 25px;

            border-radius: 15px;

            text-align: center;

            width: 100%;

            max-width: 100%;

            max-width: 600px;

            max-width: 90%;

            position: relative;

        }

        .btn-restart {

            margin-top: 15px;

            padding: 10px 20px;

            background-color: #3498db;

            color: white;

            border: none;

            border-radius: 5px;

            cursor: pointer;

            font-size: 16px;

            margin-left: 10px;

        }

        /* 备用链接按钮 */

        .fallback-link {

            display: inline-block;

            margin-top: 15px;

            padding: 10px 20px;

            background-color: #e74c3c;

            color: white;

            text-decoration: none;

            border-radius: 5px;

            font-size: 16px;

            font-weight: bold;

        }

        .fallback-text {

            font-size: 12px;

            color: #999;

            margin-top: 5px;

        }

        /* 返回按钮样式 */

        
            </style>

    <!-- Global Light Cyberpunk Theme -->

    <link rel="stylesheet" href="../css/cyberpunk.css">

    <link rel="stylesheet" href="../css/responsive.css">

    <link rel="stylesheet" href="../css/science-shared.css">
</head>

<body>

    <a href="index.html" class="back-btn-corner">⬅ 返回菜单</a>

    <h1>🌱 科学分类挑战</h1>

    <p>拖动下方的物品，把它们放进正确的篮子里！</p>

    <div class="game-board">

        <div class="drop-zone" id="zone-living" ondrop="drop(event)" ondragover="allowDrop(event)" data-type="living">

            <div class="zone-header">

                <h2>生物</h2><small>Benda Hidup</small>

            </div>

            <div class="zone-content"></div>

        </div>

        <div class="drop-zone" id="zone-non-living" ondrop="drop(event)" ondragover="allowDrop(event)"
            data-type="non-living">

            <div class="zone-header">

                <h2>非生物</h2><small>Benda Bukan Hidup</small>

            </div>

            <div class="zone-content"></div>

        </div>

    </div>

    <div class="items-pool" id="items-pool"></div>

        <div class="modal-overlay" id="reward-modal">
        <div class="modal-content" style="text-align: center; padding: 40px 20px;">
            <h2 style="color: #e67e22; font-size: 2rem; margin-bottom: 20px;">🎉 恭喜你全部答对！</h2>
            <p style="font-size: 1.2rem; color: #555; margin-bottom: 30px;">你已经掌握了生物和非生物的分类啦！</p>
            <button class="btn-restart" onclick="restartGame()" style="padding: 15px 30px; font-size: 1.2rem; cursor: pointer; border: none; background: #4CAF50; color: white; border-radius: 8px;">再玩一次 🔄</button>
        </div>
    </div>

    <script>

        const gameData = [
            { id: 'item1', name: '小猫', type: 'living', icon: '<svg viewBox="0 0 64 64"><circle cx="32" cy="36" r="20" fill="#FFB74D"/><path d="M12,20 L24,30 L16,40 Z" fill="#FFB74D"/><path d="M52,20 L40,30 L48,40 Z" fill="#FFB74D"/><circle cx="25" cy="32" r="3" fill="#333"/><circle cx="39" cy="32" r="3" fill="#333"/><path d="M30,38 Q32,42 34,38" stroke="#333" stroke-width="2" fill="none"/></svg>' },
            { id: 'item2', name: '石头', type: 'non-living', icon: '<svg viewBox="0 0 64 64"><path d="M10,45 Q20,20 35,25 T55,45 Q45,55 30,55 T10,45 Z" fill="#9E9E9E" stroke="#757575" stroke-width="2"/></svg>' },
            { id: 'item3', name: '向日葵', type: 'living', icon: '<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="22" fill="#FFEB3B"/><circle cx="32" cy="32" r="16" fill="#FFC107"/><circle cx="32" cy="32" r="10" fill="#795548"/></svg>' },
            { id: 'item4', name: '书本', type: 'non-living', icon: '<svg viewBox="0 0 64 64"><rect x="12" y="16" width="40" height="32" fill="#2196F3" rx="4"/><rect x="18" y="20" width="30" height="24" fill="#FFF"/><line x1="22" y1="26" x2="44" y2="26" stroke="#E0E0E0" stroke-width="2"/><line x1="22" y1="32" x2="44" y2="32" stroke="#E0E0E0" stroke-width="2"/></svg>' },
            { id: 'item5', name: '小丑鱼', type: 'living', icon: '<svg viewBox="0 0 64 64"><path d="M20,32 Q35,15 50,32 Q35,49 20,32 Z" fill="#FF9800"/><path d="M25,32 L10,22 L10,42 Z" fill="#FF9800"/><circle cx="42" cy="28" r="3" fill="#FFF"/><circle cx="42" cy="28" r="1.5" fill="#000"/></svg>' },
            { id: 'item6', name: '气球', type: 'non-living', icon: '<svg viewBox="0 0 64 64"><path d="M32,44 C15,44 18,10 32,10 C46,10 49,44 32,44 Z" fill="#F44336"/><path d="M32,44 L30,48 L34,48 Z" fill="#F44336"/><line x1="32" y1="48" x2="32" y2="60" stroke="#9E9E9E" stroke-width="2"/></svg>' },
            { id: 'item7', name: '大树', type: 'living', icon: '<svg viewBox="0 0 64 64"><rect x="28" y="30" width="8" height="25" fill="#795548"/><circle cx="32" cy="22" r="16" fill="#4CAF50"/><circle cx="22" cy="30" r="12" fill="#4CAF50"/><circle cx="42" cy="30" r="12" fill="#4CAF50"/></svg>' },
            { id: 'item8', name: '帽子', type: 'non-living', icon: '<svg viewBox="0 0 64 64"><path d="M16,40 C16,20 48,20 48,40 Z" fill="#3F51B5"/><path d="M10,40 L54,40 L54,44 L10,44 Z" fill="#3F51B5" rx="2"/></svg>' }
        ];

        let remainingItems = 0;

        // 你的视频 ID

        function initGame() {

            const pool = document.getElementById('items-pool');

            const zoneContents = document.querySelectorAll('.zone-content');

            pool.innerHTML = '';

            zoneContents.forEach(z => z.innerHTML = '');

            remainingItems = gameData.length;

            document.getElementById('reward-modal').style.display = 'none';

            // 重置视频链接，停止后台播放

            

            [...gameData].sort(() => 0.5 - Math.random()).forEach(item => {

                const div = document.createElement('div');

                div.className = 'draggable-item';

                div.draggable = true;

                div.id = item.id;

                div.dataset.type = item.type;

                div.innerHTML = `<div class="icon">${item.icon}</div><span>${item.name}</span>`;

                div.ondragstart = drag;

                // 增加移动端触摸拖拽支持

                div.style.touchAction = 'none'; // 禁用浏览器默认的触摸操作（如滚动），防止与拖拽冲突

                div.addEventListener('touchstart', handleTouchStart, { passive: false });

                div.addEventListener('touchmove', handleTouchMove, { passive: false });

                div.addEventListener('touchend', handleTouchEnd);

                div.addEventListener('touchcancel', handleTouchCancel);

                pool.appendChild(div);

            });

        }

        function allowDrop(ev) { ev.preventDefault(); if (ev.currentTarget.classList.contains('drop-zone')) ev.currentTarget.classList.add('hover'); }

        document.querySelectorAll('.drop-zone').forEach(z => z.addEventListener('dragleave', () => z.classList.remove('hover')));

        function drag(ev) {

            ev.dataTransfer.setData("text/plain", ev.target.id);

        }

        function drop(ev) {

            ev.preventDefault();

            const dropZone = ev.currentTarget.closest('.drop-zone');

            dropZone.classList.remove('hover');

            // 兼容可能遗留的 text/id 或标准 text/plain

            const itemId = ev.dataTransfer.getData("text/plain") || ev.dataTransfer.getData("text/id") || ev.dataTransfer.getData("text");

            if (!itemId) return; // 避免 null 报错

            const itemElement = document.getElementById(itemId);

            if (itemElement) {

                const itemType = itemElement.dataset.type; // 直接从DOM取type，更稳定

                if (itemType === dropZone.dataset.type) {

                    dropZone.querySelector('.zone-content').appendChild(itemElement);

                    itemElement.classList.add('dropped');

                    itemElement.draggable = false;

                    // 重置内联样式

                    Object.assign(itemElement.style, { position: '', left: '', top: '', zIndex: '', transform: '' });

                    remainingItems--;

                    if (remainingItems === 0) setTimeout(showReward, 800);

                } else {

                    itemElement.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(-10px)' }, { transform: 'translateX(10px)' }, { transform: 'translateX(0)' }], { duration: 300 });

                }

            }

        }

        // --- 手机端触摸拖拽逻辑 ---

        let touchItem = null;

        let touchStartX = 0;

        let touchStartY = 0;

        let originalStyle = {};

        function handleTouchStart(e) {

            if (this.classList.contains('dropped')) return;

            e.preventDefault();

            touchItem = this;

            const touch = e.touches[0];

            touchStartX = touch.clientX;

            touchStartY = touch.clientY;

            const rect = this.getBoundingClientRect();

            originalStyle = {

                position: this.style.position,

                left: this.style.left,

                top: this.style.top,

                zIndex: this.style.zIndex,

                transform: this.style.transform

            };

            this.style.position = 'fixed';

            this.style.left = rect.left + 'px';

            this.style.top = rect.top + 'px';

            this.style.zIndex = '9999';

            this.style.transform = 'scale(1.1) rotate(3deg)';

        }

        function handleTouchMove(e) {

            if (!touchItem) return;

            e.preventDefault();

            const touch = e.touches[0];

            const dx = touch.clientX - touchStartX;

            const dy = touch.clientY - touchStartY;

            const newLeft = parseFloat(touchItem.style.left) + dx;

            const newTop = parseFloat(touchItem.style.top) + dy;

            touchItem.style.left = newLeft + 'px';

            touchItem.style.top = newTop + 'px';

            touchStartX = touch.clientX;

            touchStartY = touch.clientY;

            // 高亮悬浮区

            touchItem.style.display = 'none';

            const elementUnderTouch = document.elementFromPoint(touch.clientX, touch.clientY);

            touchItem.style.display = '';

            document.querySelectorAll('.drop-zone').forEach(z => z.classList.remove('hover'));

            if (elementUnderTouch) {

                const zone = elementUnderTouch.closest('.drop-zone');

                if (zone) {

                    zone.classList.add('hover');

                }

            }

        }

        function handleTouchEnd(e) {

            if (!touchItem) return;

            const touch = e.changedTouches[0];

            touchItem.style.display = 'none';

            const elementUnderTouch = document.elementFromPoint(touch.clientX, touch.clientY);

            touchItem.style.display = '';

            let targetZone = elementUnderTouch ? elementUnderTouch.closest('.drop-zone') : null;

            document.querySelectorAll('.drop-zone').forEach(z => z.classList.remove('hover'));

            if (targetZone) {

                if (touchItem.dataset.type === targetZone.dataset.type) {

                    targetZone.querySelector('.zone-content').appendChild(touchItem);

                    touchItem.classList.add('dropped');

                    touchItem.draggable = false;

                    Object.assign(touchItem.style, { position: '', left: '', top: '', zIndex: '', transform: '' });

                    remainingItems--;

                    if (remainingItems === 0) setTimeout(showReward, 800);

                } else {

                    revertTouchDrop();

                }

            } else {

                revertTouchDrop();

            }

            touchItem = null;

        }

        function revertTouchDrop() {

            Object.assign(touchItem.style, originalStyle);

            touchItem.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(-10px)' }, { transform: 'translateX(10px)' }, { transform: 'translateX(0)' }], { duration: 300 });

        }

        function handleTouchCancel(e) {

            if (!touchItem) return;

            document.querySelectorAll('.drop-zone').forEach(z => z.classList.remove('hover'));

            revertTouchDrop();

            touchItem = null;

        }

                function showReward() {
            const modal = document.getElementById('reward-modal');
            modal.style.display = 'flex';
        }

        function restartGame() { initGame(); }

        window.onload = initGame;

    </script>

</body>

</html>
